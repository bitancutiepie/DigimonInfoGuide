<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digimon Evolution Guide - Digimon Trials</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header class="main-header">
            <img src="banner.png" alt="Digimon Info Guide - For the Game Digimon Trials" class="banner-image">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search any Digimon by name..."
                    aria-label="Search Digimon">
                <button type="button" class="clear-btn" onclick="clearSearch()" title="Clear search">✕</button>
            </div>
            <div id="resultCount" class="result-count"></div>
        </header>

        <main class="content-wrapper">
            <section id="digimonList" class="digimon-grid" role="list">
                <!-- Digimon cards will be injected here -->
            </section>
        </main>

        <!-- Modal for details -->
        <div id="detailModal" class="modal hidden">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <div id="modalBody">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>

        <button id="toggleTypeChart" class="floating-btn" title="View Types">Type Chart</button>

        <div id="typeModal" class="modal hidden">
            <div class="modal-content">
                <span class="close-type-modal">&times;</span>
                <h2>Type Chart</h2>
                <p class="note">Types found in the guide:</p>
                <div id="typeList" class="type-grid"></div>
            </div>
        </div>
    </div>

    <script src="guide_content.js"></script>
    <script src="script.js"></script>
</body>

</html>
