<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b1326"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="hud" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ffb700"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 800 34px 'Segoe UI', system-ui, sans-serif; fill: #f0f9ff; letter-spacing: 1.5px; }
    .sub { font: 500 14px 'Segoe UI', system-ui, sans-serif; fill: #7dd3fc; }
    .tag { font: 700 11px 'Segoe UI', system-ui, sans-serif; fill: #ffb700; letter-spacing: 1.2px; }
    .spin { animation: spin 12s linear infinite; transform-origin: 785px 110px; }
    .spinRev { animation: spin 8s linear infinite reverse; transform-origin: 785px 110px; }
    .scanline { animation: scanY 3s ease-in-out infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes scanY { 0%, 100% { transform: translateY(0px); opacity: 0.2; } 50% { transform: translateY(180px); opacity: 0.7; } }
  </style>
  <rect width="900" height="220" rx="14" fill="url(#bg)"/>
  <line x1="20" y1="20" x2="880" y2="20" stroke="#00f0ff" stroke-width="1" class="scanline"/>
  <rect x="2" y="2" width="896" height="216" rx="12" fill="none" stroke="url(#hud)" stroke-width="1.5" opacity="0.55"/>

  <!-- Rotating Tactical Radar -->
  <circle cx="785" cy="110" r="54" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="14 8" opacity="0.7" class="spin"/>
  <circle cx="785" cy="110" r="36" fill="none" stroke="#ffb700" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.8" class="spinRev"/>
  <circle cx="785" cy="110" r="8" fill="#00f0ff" opacity="0.9"/>

  <text x="56" y="72" class="tag">TACTICAL HUD  •  DIGIMON TRIALS ROM HACK</text>
  <text x="56" y="114" class="title">DIGIMON INFO GUIDE</text>
  <rect x="56" y="128" width="190" height="3" rx="1.5" fill="url(#hud)"/>
  <text x="56" y="156" class="sub">Digi-Finder  •  Evolution Trees  •  Battle Analyzer  •  Team Planner</text>
</svg>
